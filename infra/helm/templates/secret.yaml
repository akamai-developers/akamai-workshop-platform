# Optional HuggingFace token for gated models. The ungated default models do not
# need it; the Secret is created either way and referenced optionally by vLLM.
apiVersion: v1
kind: Secret
metadata:
  name: vllm-secrets
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  HUGGING_FACE_HUB_TOKEN: {{ .Values.hf_token | quote }}
