{{- /*
inference: dedicated-vllm — one DELIBERATELY under-tuned vLLM per student, in the
student's own namespace (<namespace>-sNN), pinned to a GPU node. The Service is named
`vllm` so the in-namespace workspace's VLLM_HOST=http://vllm:8000/v1 resolves to it
(no FQDN needed). Students raise --gpu-memory-utilization / --max-model-len via kubectl
in the saturate/optimize lab — that's the workshop content.

Requires per-student namespaces, so this is gated on BOTH inference=dedicated-vllm and
cluster_access=scoped (deploy.sh enforces the pairing). 1 GPU/student only — the 2-GPU
routing path is reserved for v2. Default (shared-vllm) renders nothing here, so the
default helm output is byte-identical.

One-vLLM-per-node is enforced by GPU scarcity: each pod requests nvidia.com/gpu:
{{ .Values.gpus_per_student }} and the dedicated GPU nodes are single-GPU, so a second
vLLM cannot schedule onto an occupied node. No model PVC is shared across students —
each gets its own ReadWriteOnce cache so a restart during tuning doesn't re-download.

NOTE: GPU behavior is NOT verifiable offline (no GPUs in kind — pods stay Pending). The
objects/nodeSelectors/resources are asserted offline; real scheduling is covered by the
Phase-7 smoke (dedicated-vllm, 1 student, 1 GPU).
*/ -}}
{{- if and (eq .Values.inference "dedicated-vllm") (eq .Values.cluster_access "scoped") }}
{{- $root := . }}
{{- range $n := untilStep 1 (int (add .Values.student_count 1)) 1 }}
{{- $ns := printf "%s-s%02d" $root.Values.namespace $n }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vllm-model-cache
  namespace: {{ $ns }}
  labels:
    app: vllm
    awp-student-number: "{{ $n }}"
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ $root.Values.model_cache_size }}
  storageClassName: linode-block-storage
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: {{ $ns }}
  labels:
    app: vllm
    awp-student-number: "{{ $n }}"
spec:
  replicas: 1
  # First start downloads the model to a fresh PVC on a cold GPU node; allow up to 30 min
  # before the Deployment self-reports ProgressDeadlineExceeded (default 600s is too short).
  progressDeadlineSeconds: 1800
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
        awp-student-number: "{{ $n }}"
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      nodeSelector:
        pool: gpu
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      {{- if $root.Values.model_mirror_bucket }}
      # Pull models from the in-region Object Storage mirror (seeded by `make mirror-models`)
      # instead of huggingface.co — avoids HF rate-limiting at scale. Read-only keyed access
      # (model-mirror-s3 Secret); aws s3 sync handles the file tree + resume. Takes priority
      # over predownload_models.
      initContainers:
        - name: pull-models-from-mirror
          image: {{ $root.Values.model_mirror_image }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              export HOME=/tmp   # aws-cli writes ~/.aws; /root isn't writable in this image
              # Many pods sync at once → Object Storage throttles (SlowDown). Adaptive retry
              # (env below) + low per-pod concurrency + a resumable retry loop converge the
              # herd: aws s3 sync skips already-downloaded files, so each pass makes progress
              # and the variable backoff de-synchronizes the pods.
              aws configure set default.s3.max_concurrent_requests 3 || true
              SRC="s3://{{ $root.Values.model_mirror_bucket }}/{{ $root.Values.model_mirror_prefix }}"
              echo "Syncing $SRC -> {{ $root.Values.download_dir }}"
              for attempt in $(seq 1 10); do
                if aws s3 sync "$SRC" "{{ $root.Values.download_dir }}" \
                     --endpoint-url "{{ $root.Values.model_mirror_endpoint }}" --only-show-errors; then
                  echo "mirror sync complete (attempt $attempt)"; exit 0
                fi
                echo "sync attempt $attempt throttled; backing off $((attempt * 15))s..."
                sleep $((attempt * 15))
              done
              echo "mirror sync FAILED after 10 attempts" >&2; exit 1
          envFrom:
            - secretRef:
                name: model-mirror-s3
          env:
            - name: AWS_DEFAULT_REGION
              value: {{ $root.Values.model_mirror_region | quote }}
            # Linode S3 rejects the checksums recent aws-cli v2 sends by default.
            - name: AWS_REQUEST_CHECKSUM_CALCULATION
              value: "when_required"
            - name: AWS_RESPONSE_CHECKSUM_VALIDATION
              value: "when_required"
            # Many simultaneous syncs throttle Object Storage; adaptive mode rate-limits
            # the client and backs off on SlowDown, then keeps retrying.
            - name: AWS_MAX_ATTEMPTS
              value: "20"
            - name: AWS_RETRY_MODE
              value: "adaptive"
          volumeMounts:
            - name: model-cache
              mountPath: {{ $root.Values.download_dir }}
      {{- else if $root.Values.predownload_models }}
      # Pre-pull every workshop model into the PVC so switching the served model later
      # (kubectl patch of --model + the Recreate restart above) loads from cache instead
      # of re-downloading. Idempotent: snapshot_download skips models already present.
      initContainers:
        - name: predownload-models
          image: {{ $root.Values.image }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              echo "Pre-downloading into $DL_DIR: $PREDOWNLOAD_MODELS"
              for m in $(echo "$PREDOWNLOAD_MODELS" | tr ',' ' '); do
                [ -z "$m" ] && continue
                echo ">> $m"
                M="$m" python3 -c "import os; from huggingface_hub import snapshot_download; snapshot_download(os.environ['M'], cache_dir=os.environ['DL_DIR'])"
              done
              echo "pre-download complete"
          env:
            - name: PREDOWNLOAD_MODELS
              value: {{ $root.Values.predownload_models | quote }}
            - name: DL_DIR
              value: {{ $root.Values.download_dir | quote }}
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vllm-secrets
                  key: HUGGING_FACE_HUB_TOKEN
                  optional: true
          volumeMounts:
            - name: model-cache
              mountPath: {{ $root.Values.download_dir }}
      {{- end }}
      containers:
        - name: vllm
          image: {{ $root.Values.image }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          # Deliberately under-tuned — the lab is to raise these.
          args:
            - --model={{ $root.Values.model }}
            - --download-dir={{ $root.Values.download_dir }}
            - --tensor-parallel-size={{ $root.Values.gpus_per_student }}
            - --gpu-memory-utilization={{ $root.Values.dedicated_gpu_memory_util }}
            - --max-model-len={{ $root.Values.dedicated_max_model_len }}
            - --host=0.0.0.0
            - --port=8000
            {{- /* Model-specific catalog args (reasoning/tool parsers). The shared
                   vLLM template ranges over these too; the dedicated path must match
                   or it ships with no tool-call/reasoning parser. */}}
            {{- range $root.Values.vllm_extra_args }}
            - {{ . | quote }}
            {{- end }}
          env:
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vllm-secrets
                  key: HUGGING_FACE_HUB_TOKEN
                  optional: true
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              # Sized for the small single-GPU node, NOT the shared vLLM's big-node requests.
              cpu: {{ $root.Values.dedicated_vllm_cpu_request | quote }}
              memory: {{ $root.Values.dedicated_vllm_mem_request | quote }}
              nvidia.com/gpu: {{ $root.Values.gpus_per_student }}
            limits:
              nvidia.com/gpu: {{ $root.Values.gpus_per_student }}
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            # 180 x 10s = 30 min for first-start model download + load on a cold node.
            failureThreshold: 180
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
          volumeMounts:
            - name: model-cache
              mountPath: {{ $root.Values.download_dir }}
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: vllm-model-cache
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: {{ $root.Values.shm_size }}
---
apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: {{ $ns }}
  labels:
    app: vllm
    awp-student-number: "{{ $n }}"
spec:
  type: ClusterIP
  selector:
    app: vllm
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
{{- end }}
{{- end }}
