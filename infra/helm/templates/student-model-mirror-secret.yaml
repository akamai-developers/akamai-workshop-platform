{{- /*
Read-only Object Storage key the per-student vLLM uses to sync models from the mirror
bucket (see the pull-models-from-mirror initContainer in student-vllm.yaml). One Secret
per student namespace, gated on a configured mirror AND the dedicated-vllm + scoped
pairing that creates those namespaces. No mirror configured → renders nothing, so the
default helm output is byte-identical.
*/ -}}
{{- if and .Values.model_mirror_bucket (eq .Values.inference "dedicated-vllm") (eq .Values.cluster_access "scoped") }}
{{- range $n := untilStep 1 (int (add .Values.student_count 1)) 1 }}
{{- $ns := printf "%s-s%02d" $.Values.namespace $n }}
---
apiVersion: v1
kind: Secret
metadata:
  name: model-mirror-s3
  namespace: {{ $ns }}
  labels:
    app: vllm
    awp-student-number: "{{ $n }}"
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: {{ $.Values.model_mirror_access_key | quote }}
  AWS_SECRET_ACCESS_KEY: {{ $.Values.model_mirror_secret_key | quote }}
{{- end }}
{{- end }}
