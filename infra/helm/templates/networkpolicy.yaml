# Default-deny ingress for the workshop namespace.
# Pods accept nothing unless an explicit allow rule below opens a port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: {{ .Values.namespace }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# Allow the ingress controller to reach workspaces on 8080.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-workspaces
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app: workspace
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
---
{{- if not .Values.multi_model }}
# Allow only workspaces (and the load/capacity test) in this namespace to reach
# vLLM on 8000. Student pods cannot reach each other; everything else is denied.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-workspaces-to-vllm
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app: vllm
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: workspace
        - podSelector:
            matchLabels:
              app: capacity-test
{{- if eq .Values.cluster_access "scoped" }}
        # cluster_access=scoped relocates each workspace into its own namespace
        # (labelled awp-student=true). Allow those workspaces to reach the shared vLLM
        # across namespaces — without this, shared-vllm + scoped workspaces are blocked.
        - namespaceSelector:
            matchLabels:
              awp-student: "true"
          podSelector:
            matchLabels:
              app: workspace
{{- end }}
      ports:
        - protocol: TCP
          port: 8000
{{- else }}
# Multi-model: workspaces reach agentgateway; agentgateway reaches vLLM backends.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-workspaces-to-gateway
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchExpressions:
      - key: gateway.networking.k8s.io/gateway-name
        operator: Exists
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: workspace
        - podSelector:
            matchLabels:
              app: capacity-test
{{- if eq .Values.cluster_access "scoped" }}
        # scoped: workspaces live in per-student namespaces (awp-student=true).
        - namespaceSelector:
            matchLabels:
              awp-student: "true"
          podSelector:
            matchLabels:
              app: workspace
{{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.agentgateway_port }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-vllm
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app: vllm
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: gateway.networking.k8s.io/gateway-name
                operator: Exists
      ports:
        - protocol: TCP
          port: 8000
{{- end }}
