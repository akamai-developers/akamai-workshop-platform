# Own-your-inference workshop — each student runs and TUNES their own vLLM on a
# dedicated GPU, editing manifests and applying them with kubectl from a notebook.
#
#   export TF_VAR_token=...
#   make deploy ARGS="--yes --config examples/own-inference.yaml"
#   # or:  ./deploy.sh deploy --yes --config examples/own-inference.yaml
#
# Anything omitted is filled by the wizard's autopilot. Flags override these.
# GPU STOCK is the #1 constraint here: this provisions one GPU per student in ONE
# region — reserve capacity ahead and run `infra/scripts/regions.sh preflight`.

students:     2                # TEST size: 1 GPU per student. Raise for the real room (was 12).
model:        Qwen/Qwen3-4B   # hybrid thinking model (reasons before tool calls); fits a 1-GPU plan
predownload_models: "Qwen/Qwen3-4B,RedHatAI/Qwen3-4B-FP8-dynamic,RedHatAI/Qwen3-0.6B-FP8-dynamic"
content_repo: https://github.com/akamai-developers/akamai-workshop-ai-inference   # enhanced lessons, on main
domain:       ""                            # "" → sslip.io + self-signed TLS
region:       us-sea

# --- Components (config-only; the wizard never prompts for these) ---
editor:           jupyter          # students edit + apply manifests from a notebook
inference:        dedicated-vllm   # one DELIBERATELY under-tuned vLLM per student to fix
gpus_per_student: 1                # 1 GPU each (g2-gpu-rtx4000a1-s auto-picked). 2 = v2
cluster_access:   scoped           # REQUIRED by dedicated-vllm: per-student namespace + scoped kubeconfig + NetworkPolicy
agent_deploy:     plain            # capstone: ship the tuned setup as a Deployment+Service
object_storage:   none

# The per-student vLLM ships under-tuned on purpose (helm values
# dedicated_gpu_memory_util: 0.6, dedicated_max_model_len: 8192,
# dedicated_max_num_seqs: 32). Raising the sequence cap, then testing memory
# headroom, is part of the workshop.
