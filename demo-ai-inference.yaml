# AI-inference workshop — rehearsal config (2 students).
# Token comes from $TF_VAR_token / $LINODE_TOKEN, never this file.
# Bump `students` to 20 for the real run (about 20 seats; 1 GPU node each in us-ord).
# Kubernetes version is auto-picked by deploy.sh from what LKE offers (1.37 as of Nov 2026).
# Object Storage is not used by this preset; if it ever is, buckets go to an E3 endpoint
# in the cluster region (never us-sea).
preset: own-inference          # jupyter + dedicated-vllm + scoped + inference content repo
label: demo-ai-inference-1
students: 2

# Served model: start from the full-size BF16 baseline. Single value = single-model mode.
model: Qwen/Qwen3-4B

# Pre-pull the baseline, FP8 target, and drafters into each student's PVC so switch_model() is a fast restart-from-cache.
predownload_models: "Qwen/Qwen3-4B,RedHatAI/Qwen3-4B-FP8-dynamic,RedHatAI/Qwen3-0.6B-FP8-dynamic"

domain: ws.akamai-workshops.com
region: us-ord

# agent_deploy: none           # uncomment if the inference content ships no agent (preset defaults to plain)
